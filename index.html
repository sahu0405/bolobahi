<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>BoloBahi — Transport Cashbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:#F4F4F0;min-height:100vh;}
.app{max-width:420px;margin:0 auto;min-height:100vh;background:#F4F4F0;}
.header{background:#fff;border-bottom:0.5px solid #e0e0e0;padding:14px 16px 10px;position:sticky;top:0;z-index:50;}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;}
.logo{font-size:20px;font-weight:600;color:#1a1a1a;}
.logo span{color:#1D9E75;}
.tagline{font-size:11px;color:#888;}
.balance-bar{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 16px;background:#fff;border-bottom:0.5px solid #e0e0e0;}
.bal-card{background:#F4F4F0;border-radius:10px;padding:8px 10px;}
.bal-label{font-size:10px;color:#888;margin-bottom:2px;}
.bal-amount{font-size:16px;font-weight:600;}
.bal-amount.cash{color:#1D9E75;}
.bal-amount.bank{color:#185FA5;}
.tabs{display:flex;background:#fff;border-bottom:0.5px solid #e0e0e0;position:sticky;top:57px;z-index:49;}
.tab{flex:1;padding:10px 4px;font-size:12px;text-align:center;color:#888;cursor:pointer;border-bottom:2px solid transparent;transition:all 0.15s;}
.tab.active{color:#1D9E75;border-bottom-color:#1D9E75;font-weight:500;}
.tab i{display:block;font-size:17px;margin-bottom:2px;}
.content{padding:12px 16px 80px;}
.add-btn{width:100%;background:#1D9E75;color:#fff;border:none;border-radius:10px;padding:12px;font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:14px;}
.add-btn:active{transform:scale(0.98);}
.section-label{font-size:11px;color:#888;font-weight:500;margin-bottom:8px;letter-spacing:0.5px;text-transform:uppercase;}
.entry-card{background:#fff;border:0.5px solid #e8e8e8;border-radius:12px;padding:12px 14px;margin-bottom:8px;}
.entry-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;}
.entry-party{font-size:14px;font-weight:500;color:#1a1a1a;}
.entry-amount{font-size:15px;font-weight:600;}
.amount-receipt{color:#1D9E75;}
.amount-payment{color:#E24B4A;}
.entry-narration{font-size:12px;color:#888;margin-top:3px;}
.freight-route{font-size:11px;color:#888;display:flex;align-items:center;gap:3px;margin-top:2px;}
.freight-numbers{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:10px;padding-top:8px;border-top:0.5px solid #f0f0f0;}
.fn-item{text-align:center;}
.fn-label{font-size:9px;color:#aaa;text-transform:uppercase;margin-bottom:2px;}
.fn-val{font-size:13px;font-weight:500;color:#1a1a1a;}
.fn-val.balance{color:#E24B4A;}
.status-badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:20px;font-weight:500;margin-top:4px;}
.badge-pending{background:#FAEEDA;color:#854F0B;}
.badge-partial{background:#E6F1FB;color:#185FA5;}
.badge-cleared{background:#EAF3DE;color:#3B6D11;}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:100;align-items:flex-end;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:420px;padding:20px 16px 32px;max-height:90vh;overflow-y:auto;}
.modal-handle{width:40px;height:4px;background:#e0e0e0;border-radius:2px;margin:0 auto 16px;}
.modal-title{font-size:16px;font-weight:600;margin-bottom:16px;color:#1a1a1a;}
.form-row{margin-bottom:12px;}
.form-label{font-size:12px;color:#666;margin-bottom:4px;display:block;}
.form-row input,.form-row select{width:100%;padding:10px 12px;font-size:14px;border:0.5px solid #ddd;border-radius:10px;background:#fafafa;color:#1a1a1a;font-family:'DM Sans',sans-serif;outline:none;}
.form-row input:focus,.form-row select:focus{border-color:#1D9E75;background:#fff;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.modal-actions{display:flex;gap:8px;margin-top:18px;}
.btn-cancel{flex:1;padding:11px;border:0.5px solid #ddd;border-radius:10px;background:transparent;color:#666;font-size:14px;cursor:pointer;font-family:'DM Sans',sans-serif;}
.btn-save{flex:2;padding:11px;background:#1D9E75;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;}
.btn-save:disabled,.btn-start:disabled{opacity:0.6;cursor:not-allowed;}
.setup-screen{padding:24px 16px;}
.setup-icon{font-size:40px;color:#1D9E75;margin-bottom:14px;}
.setup-title{font-size:22px;font-weight:600;color:#1a1a1a;margin-bottom:6px;}
.setup-sub{font-size:13px;color:#888;margin-bottom:24px;line-height:1.6;}
.btn-start{width:100%;background:#1D9E75;color:#fff;border:none;border-radius:10px;padding:14px;font-size:15px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:8px;}
.btn-outline{width:100%;background:transparent;color:#1D9E75;border:0.5px solid #1D9E75;border-radius:10px;padding:12px;font-size:14px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:10px;}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 22px;border-radius:20px;font-size:13px;font-weight:500;z-index:200;opacity:0;transition:opacity 0.3s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;}
.toast.error{background:#E24B4A;}
.toast.success{background:#1D9E75;}
.empty-state{text-align:center;padding:40px 0;color:#aaa;font-size:13px;}
.empty-state i{font-size:36px;display:block;margin-bottom:10px;color:#ccc;}
.loading-state{text-align:center;padding:40px 0;color:#aaa;font-size:13px;}
.entry-date{font-size:10px;color:#aaa;margin-top:4px;}
</style>
</head>
<body>
<div class="app" id="app">
  <div id="setup-view">
    <div class="header">
      <div class="header-top"><div class="logo">Bolo<span>Bahi</span></div></div>
      <div class="tagline">Voice cashbook for transport brokers</div>
    </div>
    <div class="setup-screen">
      <div class="setup-icon"><i class="ti ti-book"></i></div>
      <div class="setup-title">Welcome to BoloBahi</div>
      <div class="setup-sub">Enter your opening balances to start tracking freight, cash, and bank entries.</div>
      <div class="form-row">
        <label class="form-label">Firm / broker name</label>
        <input type="text" id="opening-firm" placeholder="e.g. Ravi Transport Brokerage" />
      </div>
      <div class="form-row">
        <label class="form-label">Cash in hand (₹)</label>
        <input type="number" id="opening-cash" placeholder="e.g. 12500" />
      </div>
      <div class="form-row">
        <label class="form-label">Bank balance (₹)</label>
        <input type="number" id="opening-bank" placeholder="e.g. 245000" />
      </div>
      <button class="btn-start" id="btn-start-app" onclick="startApp()">Start BoloBahi →</button>
    </div>
  </div>

  <div id="main-view" style="display:none;">
    <div class="header">
      <div class="header-top">
        <div class="logo">Bolo<span>Bahi</span></div>
        <span style="font-size:12px;color:#888;" id="firm-display"></span>
      </div>
      <div class="tagline" id="today-date"></div>
    </div>
    <div class="balance-bar">
      <div class="bal-card">
        <div class="bal-label"><i class="ti ti-wallet"></i> Cash in hand</div>
        <div class="bal-amount cash" id="cash-balance">₹0</div>
      </div>
      <div class="bal-card">
        <div class="bal-label"><i class="ti ti-building-bank"></i> Bank balance</div>
        <div class="bal-amount bank" id="bank-balance">₹0</div>
      </div>
    </div>
    <div class="tabs">
      <div class="tab active" onclick="switchTab('freight')" id="tab-freight"><i class="ti ti-truck"></i>Freight</div>
      <div class="tab" onclick="switchTab('cash')" id="tab-cash"><i class="ti ti-wallet"></i>Cash Book</div>
      <div class="tab" onclick="switchTab('bank')" id="tab-bank"><i class="ti ti-building-bank"></i>Bank Book</div>
    </div>
    <div class="content" id="content-area"></div>
  </div>
</div>

<!-- Freight Modal -->
<div class="modal-overlay" id="modal-freight">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title"><i class="ti ti-truck"></i> Add freight entry</div>
    <div class="form-row"><label class="form-label">Lorry number</label><input type="text" id="f-lorry" placeholder="OD 05 AB 1234" /></div>
    <div class="form-row"><label class="form-label">Party name</label><input type="text" id="f-party" placeholder="Ravi Transport" /></div>
    <div class="form-grid">
      <div class="form-row"><label class="form-label">From</label><input type="text" id="f-from" placeholder="Bhubaneswar" /></div>
      <div class="form-row"><label class="form-label">To</label><input type="text" id="f-to" placeholder="Kolkata" /></div>
    </div>
    <div class="form-grid">
      <div class="form-row"><label class="form-label">Freight (₹)</label><input type="number" id="f-freight" placeholder="25000" /></div>
      <div class="form-row"><label class="form-label">Advance (₹)</label><input type="number" id="f-advance" placeholder="10000" /></div>
    </div>
    <div class="form-row"><label class="form-label">Status</label>
      <select id="f-status"><option value="Pending">Pending</option><option value="Partial">Partial</option><option value="Cleared">Cleared</option></select>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('modal-freight')">Cancel</button>
      <button class="btn-save" id="save-freight-btn" onclick="saveFreight()">Save entry</button>
    </div>
  </div>
</div>

<!-- Cash Modal -->
<div class="modal-overlay" id="modal-cash">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title"><i class="ti ti-wallet"></i> Add cash entry</div>
    <div class="form-row"><label class="form-label">Type</label>
      <select id="c-type"><option value="Receipt">Receipt (money in)</option><option value="Payment">Payment (money out)</option></select>
    </div>
    <div class="form-row"><label class="form-label">Party name</label><input type="text" id="c-party" placeholder="Ravi Transport" /></div>
    <div class="form-row"><label class="form-label">Narration</label><input type="text" id="c-narration" placeholder="Freight received for OD05AB1234" /></div>
    <div class="form-row"><label class="form-label">Amount (₹)</label><input type="number" id="c-amount" placeholder="15000" /></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('modal-cash')">Cancel</button>
      <button class="btn-save" id="save-cash-btn" onclick="saveCash()">Save entry</button>
    </div>
  </div>
</div>

<!-- Bank Modal -->
<div class="modal-overlay" id="modal-bank">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title"><i class="ti ti-building-bank"></i> Add bank entry</div>
    <div class="form-row"><label class="form-label">Type</label>
      <select id="b-type"><option value="Receipt">Receipt (money in)</option><option value="Payment">Payment (money out)</option></select>
    </div>
    <div class="form-row"><label class="form-label">Party name</label><input type="text" id="b-party" placeholder="Suresh Logistics" /></div>
    <div class="form-row"><label class="form-label">Narration</label><input type="text" id="b-narration" placeholder="NEFT received from Suresh" /></div>
    <div class="form-row"><label class="form-label">Amount (₹)</label><input type="number" id="b-amount" placeholder="50000" /></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('modal-bank')">Cancel</button>
      <button class="btn-save" id="save-bank-btn" onclick="saveBank()">Save entry</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPA_URL = 'https://jienvymxmwxlqvqehjrw.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImppZW52eW14bXd4bHF2cWVoanJ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzNTQzNTksImV4cCI6MjA5NDkzMDM1OX0.nAHhapQSLQyzbF7shQbMaTSICCq7bXIrREAuS8leY2I';
const headers = {'Content-Type':'application/json','apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Prefer':'return=representation'};
let state = {cashBalance:0,bankBalance:0,firmName:'',activeTab:'freight'};

function fmt(n){return '₹'+Math.round(n).toLocaleString('en-IN');}

function showToast(msg,type){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.className='toast show'+(type?' '+type:'');
  setTimeout(()=>t.className='toast',2500);
}

async function supa(method,table,body,params){
  let url=SUPA_URL+'/rest/v1/'+table;
  if(params) url+='?'+params;
  const opts={method,headers};
  if(body) opts.body=JSON.stringify(body);
  const res=await fetch(url,opts);
  if(!res.ok){const e=await res.text();throw new Error(e);}
  if(method==='DELETE'||res.status===204) return null;
  return res.json();
}

async function startApp(){
  const firm=document.getElementById('opening-firm').value.trim()||'My Brokerage';
  const cash=parseFloat(document.getElementById('opening-cash').value)||0;
  const bank=parseFloat(document.getElementById('opening-bank').value)||0;
  const btn=document.getElementById('btn-start-app');
  btn.disabled=true;btn.textContent='Saving...';
  try{
    await supa('POST','bb_settings',{id:'main',firm_name:firm,cash_balance:cash,bank_balance:bank});
  }catch(e){
    try{await supa('PATCH','bb_settings',{firm_name:firm,cash_balance:cash,bank_balance:bank},'id=eq.main');}
    catch(e2){showToast('Error: '+e2.message,'error');btn.disabled=false;btn.textContent='Start BoloBahi →';return;}
  }
  state.firmName=firm;state.cashBalance=cash;state.bankBalance=bank;
  launchMain();
}

function launchMain(){
  document.getElementById('setup-view').style.display='none';
  document.getElementById('main-view').style.display='block';
  document.getElementById('firm-display').textContent=state.firmName;
  document.getElementById('today-date').textContent=new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  updateBalances();renderContent();
}

async function loadSettings(){
  try{
    const data=await supa('GET','bb_settings',null,'id=eq.main');
    if(data&&data.length>0){
      const s=data[0];
      state.firmName=s.firm_name||'My Brokerage';
      state.cashBalance=parseFloat(s.cash_balance)||0;
      state.bankBalance=parseFloat(s.bank_balance)||0;
      launchMain();return true;
    }
  }catch(e){}
  return false;
}

function updateBalances(){
  document.getElementById('cash-balance').textContent=fmt(state.cashBalance);
  document.getElementById('bank-balance').textContent=fmt(state.bankBalance);
}

async function updateSettingsBalance(){
  try{await supa('PATCH','bb_settings',{cash_balance:state.cashBalance,bank_balance:state.bankBalance},'id=eq.main');}catch(e){}
}

function switchTab(tab){
  state.activeTab=tab;
  ['freight','cash','bank'].forEach(t=>document.getElementById('tab-'+t).classList.toggle('active',t===tab));
  renderContent();
}

async function renderContent(){
  const area=document.getElementById('content-area');
  if(state.activeTab==='freight') await renderFreight(area);
  else if(state.activeTab==='cash') await renderBook(area,'cash');
  else await renderBook(area,'bank');
}

async function renderFreight(area){
  let html='<button class="add-btn" onclick="openModal(\'modal-freight\')"><i class="ti ti-plus"></i> Add freight entry</button>';
  area.innerHTML=html+'<div class="loading-state">Loading entries...</div>';
  try{
    const entries=await supa('GET','bb_freight',null,'order=created_at.desc');
    let ehtml=html;
    if(!entries||entries.length===0){
      ehtml+='<div class="empty-state"><i class="ti ti-truck"></i>No freight entries yet.<br>Tap above to add your first entry.</div>';
    }else{
      ehtml+='<div class="section-label">All entries</div>';
      entries.forEach(e=>{
        const bal=e.freight-e.advance;
        const bc=e.status==='Pending'?'badge-pending':e.status==='Partial'?'badge-partial':'badge-cleared';
        const dt=new Date(e.created_at).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
        ehtml+=`<div class="entry-card">
          <div class="entry-top">
            <div><div class="entry-party">${e.party}</div><div class="freight-route"><i class="ti ti-arrow-narrow-right"></i>${e.route_from} → ${e.route_to}</div></div>
            <div style="text-align:right;"><div style="font-size:11px;color:#aaa;">${e.lorry}</div><span class="status-badge ${bc}">${e.status}</span></div>
          </div>
          <div class="freight-numbers">
            <div class="fn-item"><div class="fn-label">Freight</div><div class="fn-val">${fmt(e.freight)}</div></div>
            <div class="fn-item"><div class="fn-label">Advance</div><div class="fn-val">${fmt(e.advance)}</div></div>
            <div class="fn-item"><div class="fn-label">Balance due</div><div class="fn-val balance">${fmt(bal)}</div></div>
          </div>
          <div class="entry-date">${dt}</div>
        </div>`;
      });
    }
    area.innerHTML=ehtml;
  }catch(err){area.innerHTML=html+'<div class="empty-state">Error loading. Check connection.</div>';}
}

async function renderBook(area,type){
  const label=type==='cash'?'cash':'bank';
  const modal=type==='cash'?'modal-cash':'modal-bank';
  let html=`<button class="add-btn" onclick="openModal('${modal}')"><i class="ti ti-plus"></i> Add ${label} entry</button>`;
  area.innerHTML=html+'<div class="loading-state">Loading entries...</div>';
  try{
    const entries=await supa('GET','bb_'+type,null,'order=created_at.desc');
    let ehtml=html;
    if(!entries||entries.length===0){
      ehtml+=`<div class="empty-state"><i class="ti ti-notebook"></i>No ${label} entries yet.</div>`;
    }else{
      ehtml+='<div class="section-label">All entries</div>';
      entries.forEach(e=>{
        const isR=e.type==='Receipt';
        const dt=new Date(e.created_at).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
        ehtml+=`<div class="entry-card">
          <div class="entry-top">
            <div><div class="entry-party">${e.party}</div><div class="entry-narration">${e.narration||''}</div></div>
            <div class="entry-amount ${isR?'amount-receipt':'amount-payment'}">${isR?'+':'-'}${fmt(e.amount)}</div>
          </div>
          <div style="display:flex;justify-content:space-between;margin-top:8px;align-items:center;">
            <span style="font-size:10px;padding:2px 8px;border-radius:20px;font-weight:500;background:${isR?'#EAF3DE':'#FCEBEB'};color:${isR?'#3B6D11':'#A32D2D'};">${e.type}</span>
            <span style="font-size:11px;color:#aaa;">Bal: ${fmt(e.running_balance)}</span>
          </div>
          <div class="entry-date">${dt}</div>
        </div>`;
      });
    }
    area.innerHTML=ehtml;
  }catch(err){area.innerHTML=html+'<div class="empty-state">Error loading. Check connection.</div>';}
}

function openModal(id){document.getElementById(id).classList.add('open');}
function closeModal(id){document.getElementById(id).classList.remove('open');}

async function saveFreight(){
  const btn=document.getElementById('save-freight-btn');
  btn.disabled=true;btn.textContent='Saving...';
  const entry={lorry:document.getElementById('f-lorry').value||'Unknown',party:document.getElementById('f-party').value||'Unknown',route_from:document.getElementById('f-from').value||'-',route_to:document.getElementById('f-to').value||'-',freight:parseFloat(document.getElementById('f-freight').value)||0,advance:parseFloat(document.getElementById('f-advance').value)||0,status:document.getElementById('f-status').value};
  try{
    await supa('POST','bb_freight',entry);
    showToast('Freight entry saved!','success');
    closeModal('modal-freight');
    ['f-lorry','f-party','f-from','f-to','f-freight','f-advance'].forEach(id=>document.getElementById(id).value='');
    await renderContent();
  }catch(e){showToast('Error: '+e.message,'error');}
  btn.disabled=false;btn.textContent='Save entry';
}

async function saveCash(){
  const btn=document.getElementById('save-cash-btn');
  btn.disabled=true;btn.textContent='Saving...';
  const amount=parseFloat(document.getElementById('c-amount').value)||0;
  const type=document.getElementById('c-type').value;
  if(type==='Receipt') state.cashBalance+=amount; else state.cashBalance-=amount;
  const entry={type,amount,party:document.getElementById('c-party').value||'Unknown',narration:document.getElementById('c-narration').value||'',running_balance:state.cashBalance};
  try{
    await supa('POST','bb_cash',entry);
    await updateSettingsBalance();
    updateBalances();
    showToast('Cash entry saved!','success');
    closeModal('modal-cash');
    ['c-party','c-narration','c-amount'].forEach(id=>document.getElementById(id).value='');
    await renderContent();
  }catch(e){showToast('Error: '+e.message,'error');if(type==='Receipt') state.cashBalance-=amount; else state.cashBalance+=amount;}
  btn.disabled=false;btn.textContent='Save entry';
}

async function saveBank(){
  const btn=document.getElementById('save-bank-btn');
  btn.disabled=true;btn.textContent='Saving...';
  const amount=parseFloat(document.getElementById('b-amount').value)||0;
  const type=document.getElementById('b-type').value;
  if(type==='Receipt') state.bankBalance+=amount; else state.bankBalance-=amount;
  const entry={type,amount,party:document.getElementById('b-party').value||'Unknown',narration:document.getElementById('b-narration').value||'',running_balance:state.bankBalance};
  try{
    await supa('POST','bb_bank',entry);
    await updateSettingsBalance();
    updateBalances();
    showToast('Bank entry saved!','success');
    closeModal('modal-bank');
    ['b-party','b-narration','b-amount'].forEach(id=>document.getElementById(id).value='');
    await renderContent();
  }catch(e){showToast('Error: '+e.message,'error');if(type==='Receipt') state.bankBalance-=amount; else state.bankBalance+=amount;}
  btn.disabled=false;btn.textContent='Save entry';
}

loadSettings();
</script>
</body>
</html>
